[package]
name = "pepper-nao-driver"
version = "0.1.0"
edition = "2024"
description = "Pepper robot driver binding the NAOqi QI surface to domain capabilities over a pluggable transport"
authors = [
    "SinfonIA Uniandes <sinfonia@uniandes.edu.co>",
    "Juan David Guevara <soyjuandavidguevara@gmail.com>",
]
license = "Apache-2.0"

[dependencies]
# QI stack: the only source of QI functionality. Nothing QI-related is
# reimplemented here. The fork tracks libqi-rs development towards the official
# aldebaran/libqi-rs.
qi = { git = "https://github.com/JuanDGA/libqi-rs", branch = "develop" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
jpeg-encoder = "0.6"
libc = "0.2"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
