[package]
name = "al-robot-driver-rs"
version = "0.1.0"
edition = "2024"
description = "Pepper robot driver binding the NAOqi QI surface to domain capabilities over a pluggable transport"
license = "GPL-3.0-only"

[dependencies]
# QI stack: the only source of QI functionality. Nothing QI-related is reimplemented here.
qi = { version = "1.0.0-dev", path = "../../libqi-rs/qi" }

async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
